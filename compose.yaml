# untis-mcp – Streamable HTTP on 127.0.0.1:3000
#
# Before the first start: create secrets/ from secrets.example/ (see secrets.example/README.txt).
#
# Prebuilt image from GHCR:   docker compose pull && docker compose up -d
# Build locally instead:      docker compose up -d --build
#
# Pin a version with UNTIS_MCP_VERSION=0.1.0 (default: latest), change the host port with UNTIS_MCP_PORT.
# Both can be set in a .env file next to this file.
services:
  untis-mcp:
    image: ghcr.io/ludoo0/untis-mcp:${UNTIS_MCP_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UNTIS_MCP_PORT:-3000}:3000"   # localhost only; put a TLS reverse proxy in front for remote access
    environment:
      UNTIS_QR_URL_FILE: /run/secrets/untis_qr_url
      MCP_API_KEY_FILE: /run/secrets/mcp_api_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDACTION_LANGUAGE: ${REDACTION_LANGUAGE:-de}
      REDACTION_KEEP_WORDS: ${REDACTION_KEEP_WORDS:-}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      # ABSENCE_TEXTS: drop          # never return absence reasons/texts
      # REDACT_TEACHERS: "true"      # pseudonymise teachers as well
    secrets: [untis_qr_url, mcp_api_key]
    volumes:
      - untis-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

secrets:
  untis_qr_url:
    file: ./secrets/untis_qr_url
  mcp_api_key:
    file: ./secrets/mcp_api_key

volumes:
  untis-data:
