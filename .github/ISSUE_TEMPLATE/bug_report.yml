name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post real data from a WebUntis account** – no names, messages, course titles, IDs, tokens or screenshots of real content.
        Describe the *shape* of the problem instead. The output of `bun run smoke --details` contains only counts and masked structure and is safe to share.

        **Redaction leaks (personal data visible to the agent) are security issues** – please report them privately, see [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Which tool, which parameters, what did you expect, what did you get (structure only).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.1.0 / commit sha / ghcr.io/ludoo0/untis-mcp:0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How do you run it?
      options:
        - Docker (HTTP)
        - Local Bun (stdio)
        - Local Bun (HTTP)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs / smoke-test output
      description: Server logs contain no content by design, but please double-check before pasting.
      render: text
